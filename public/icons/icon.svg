<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Private Chess Lesson Planner: a student's manila folder, open just enough
       to show the board on an index card, clipped shut. No knight. -->
  <defs>
    <clipPath id="rounded"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6a4c"/>
      <stop offset="1" stop-color="#1f4a34"/>
    </linearGradient>
    <linearGradient id="manila" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d49a"/>
      <stop offset="1" stop-color="#dcb56e"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#felt)"/>
    <!-- felt weave -->
    <g opacity="0.08" fill="#fff">
      <rect x="0" y="0" width="512" height="512" fill="url(#felt)" opacity="0"/>
      <path d="M0 0h512v6H0zM0 24h512v6H0zM0 48h512v6H0zM0 72h512v6H0zM0 96h512v6H0zM0 120h512v6H0zM0 144h512v6H0zM0 168h512v6H0zM0 192h512v6H0zM0 216h512v6H0zM0 240h512v6H0zM0 264h512v6H0zM0 288h512v6H0zM0 312h512v6H0zM0 336h512v6H0zM0 360h512v6H0zM0 384h512v6H0zM0 408h512v6H0zM0 432h512v6H0zM0 456h512v6H0zM0 480h512v6H0zM0 504h512v6H0z"/>
    </g>
  </g>

  <!-- the folder, tilted like it was just set down -->
  <g transform="rotate(-6 256 290)" filter="url(#drop)">
    <!-- back cover -->
    <path d="M84 120h118l22 30h204a16 16 0 0 1 16 16v272a16 16 0 0 1-16 16H84a16 16 0 0 1-16-16V136a16 16 0 0 1 16-16z" fill="#c9a25e"/>
    <!-- index card with the board, peeking out -->
    <g transform="translate(140 98) rotate(3)">
      <rect x="0" y="0" width="250" height="260" rx="8" fill="#fbfaf6"/>
      <path d="M0 40h250" stroke="#e8b2ad" stroke-width="3"/>
      <path d="M0 74h250M0 108h250M0 142h250M0 176h250M0 210h250M0 244h250" stroke="#dfe7f2" stroke-width="3"/>
      <!-- 4x4 board with the app's black rules -->
      <g transform="translate(37 52)">
        <rect x="0" y="0" width="176" height="176" fill="#f0d9b5"/>
        <g fill="#b58863">
          <rect x="44" y="0" width="44" height="44"/><rect x="132" y="0" width="44" height="44"/>
          <rect x="0" y="44" width="44" height="44"/><rect x="88" y="44" width="44" height="44"/>
          <rect x="44" y="88" width="44" height="44"/><rect x="132" y="88" width="44" height="44"/>
          <rect x="0" y="132" width="44" height="44"/><rect x="88" y="132" width="44" height="44"/>
        </g>
        <path d="M44 0v176M88 0v176M132 0v176M0 44h176M0 88h176M0 132h176" stroke="#1b1b19" stroke-width="2"/>
        <rect x="0" y="0" width="176" height="176" fill="none" stroke="#1b1b19" stroke-width="6"/>
      </g>
    </g>
    <!-- front cover -->
    <path d="M68 300h376v138a16 16 0 0 1-16 16H84a16 16 0 0 1-16-16z" fill="url(#manila)"/>
    <!-- crease -->
    <path d="M68 300h376" stroke="#000" stroke-opacity="0.12" stroke-width="4"/>
    <!-- the student's tab, with its colour dot -->
    <rect x="84" y="104" width="130" height="40" rx="10" fill="#f0d49a"/>
    <circle cx="112" cy="124" r="9" fill="#000" fill-opacity="0.35"/>
    <rect x="132" y="117" width="64" height="14" rx="7" fill="#000" fill-opacity="0.22"/>
    <!-- rubber stamp -->
    <g transform="translate(262 358) rotate(-8)">
      <rect x="0" y="0" width="150" height="46" rx="8" fill="none" stroke="#2e7d5b" stroke-width="7"/>
      <rect x="18" y="14" width="26" height="18" rx="3" fill="#2e7d5b"/>
      <rect x="52" y="14" width="80" height="18" rx="3" fill="#2e7d5b"/>
    </g>
    <!-- brass paper clip -->
    <g transform="translate(336 66) rotate(12)" fill="none" stroke="#b8902a" stroke-width="9" stroke-linecap="round">
      <path d="M26 150V36a22 22 0 0 1 44 0v104a14 14 0 0 1-28 0V52"/>
    </g>
  </g>
</svg>
